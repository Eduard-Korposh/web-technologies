<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 1. Таблиця</title>
</head>
<body>
    <div style="text-align: center;">
        <a href="../index.html">Повернутись на головну</a>
        <table style="margin: 0 auto; border: 2px solid black;">
            <tr>
                <td colspan="8" style="border: 2px solid black; width: 50px; height: 50px; background-color: aquamarine;"></td>
            </tr>
            <tr>
                <td rowspan="6" style="border: 2px solid black; width: 50px; height: 50px; background-color: lightyellow;"></td>
                <td colspan="6" style="border: 2px solid black; width: 50px; height: 50px; background-color: aquamarine;"></td>
                <td rowspan="6" style="border: 2px solid black; width: 50px; height: 50px; background-color: lightyellow;"></td>
            </tr>
            <tr>
                <td rowspan="4" style="border: 2px solid black; width: 50px; height: 50px; background-color: lightyellow;"></td>
                <td colspan="4" style="border: 2px solid black; width: 50px; height: 50px; background-color: aquamarine;"></td>
                <td rowspan="4" style="border: 2px solid black; width: 50px; height: 50px; background-color: lightyellow;"></td>
            </tr>
            <tr>
                <td rowspan="2" style="border: 2px solid black; width: 50px; height: 50px; background-color: lightyellow;"></td>
                <td style="border: 2px solid black; width: 50px; height: 50px; background-color: red;"></td>
                <td style="border: 2px solid black; width: 50px; height: 50px; background-color: blue;"></td>
                <td rowspan="2" style="border: 2px solid black; width: 50px; height: 50px; background-color: lightyellow;"></td>
            </tr>
            <tr>
                <td style="border: 2px solid black; width: 50px; height: 50px; background-color: lime;"></td>
                <td style="border: 2px solid black; width: 50px; height: 50px; background-color: yellow;"></td>
            </tr>
            <tr>
                <td colspan="4" style="border: 2px solid black; width: 50px; height: 50px; background-color: aquamarine;"></td>
            </tr>
            <tr>
                <td colspan="6" style="border: 2px solid black; width: 50px; height: 50px; background-color: aquamarine;"></td>
            </tr>
            <tr>
                <td colspan="8" style="border: 2px solid black; width: 50px; height: 50px; background-color: aquamarine;"></td>
            </tr>
        </table>
    </div>
</body>
</html>
