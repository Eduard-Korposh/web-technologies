<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>План подорожі</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="plan">
    <h1 class="plan__title">План подорожі:</h1>
    <ul class="plan__groups">
      <li class="plan__group">
        <span class="plan__group-title">Підготовчий етап</span>
        <ul class="plan__tasks">
          <li class="plan__task plan__task_icon_route"><span class="plan__task-name">Обрати маршрут</span></li>
          <li class="plan__task plan__task_icon_ticket"><span class="plan__task-name">Квитки на літак</span></li>
          <li class="plan__task plan__task_icon_hotel"><span class="plan__task-name">Готель</span></li>
          <li class="plan__task plan__task_icon_car-rental"><span class="plan__task-name">Оренда авто</span></li>
        </ul>
      </li>

      <li class="plan__group">
        <span class="plan__group-title">Відпочинок</span>
        <ul class="plan__tasks">
          <li class="plan__task plan__task_icon_bar"><span class="plan__task-name">Бари</span></li>
          <li class="plan__task plan__task_icon_casino"><span class="plan__task-name">Казино</span></li>
          <li class="plan__task plan__task_icon_museum"><span class="plan__task-name">Музеї</span></li>
          <li class="plan__task plan__task_icon_festival"><span class="plan__task-name">Фестивалі</span></li>
        </ul>
      </li>
    </ul>
  </div>
</body>
</html>
