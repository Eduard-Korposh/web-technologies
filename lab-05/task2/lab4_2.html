<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тарифи інтернет-провайдера</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <table class="tariffs">
    <thead>
      <tr>
        <th class="tariffs__cell tariffs__heading">Оберіть тариф</th>
        <th class="tariffs__cell tariffs__heading tariffs__heading_plan_basic">Базовий<br>200 грн</th>
        <th class="tariffs__cell tariffs__heading tariffs__heading_plan_optimal">Оптимальний<br>400 грн</th>
        <th class="tariffs__cell tariffs__heading tariffs__heading_plan_premium">Преміум<br>650 грн</th>
        <th class="tariffs__cell tariffs__heading tariffs__heading_plan_pro">Професійний<br>1000 грн</th>
      </tr>
    </thead>

    <tbody>
      <tr class="tariffs__row">
        <th class="tariffs__cell tariffs__feature">Безлімітний трафік</th>
        <td class="tariffs__cell">+</td>
        <td class="tariffs__cell">+</td>
        <td class="tariffs__cell">+</td>
        <td class="tariffs__cell">+</td>
      </tr>
      <tr class="tariffs__row">
        <th class="tariffs__cell tariffs__feature">Wi-Fi роутер</th>
        <td class="tariffs__cell">-</td>
        <td class="tariffs__cell">+</td>
        <td class="tariffs__cell">+</td>
        <td class="tariffs__cell">+</td>
      </tr>
      <tr class="tariffs__row">
        <th class="tariffs__cell tariffs__feature">Статична IP-адреса</th>
        <td class="tariffs__cell">-</td>
        <td class="tariffs__cell">-</td>
        <td class="tariffs__cell">+</td>
        <td class="tariffs__cell">+</td>
      </tr>
      <tr class="tariffs__row">
        <th class="tariffs__cell tariffs__feature">Телебачення</th>
        <td class="tariffs__cell">-</td>
        <td class="tariffs__cell">+</td>
        <td class="tariffs__cell">-</td>
        <td class="tariffs__cell">+</td>
      </tr>
      <tr class="tariffs__row">
        <th class="tariffs__cell tariffs__feature">Підтримка 24/7</th>
        <td class="tariffs__cell">-</td>
        <td class="tariffs__cell">-</td>
        <td class="tariffs__cell">-</td>
        <td class="tariffs__cell">+</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
