<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тарифи інтернет-провайдера</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <table>
    <thead>
      <tr>
        <th>Оберіть тариф</th>
        <th>Базовий<br>200 грн</th>
        <th>Оптимальний<br>400 грн</th>
        <th>Преміум<br>650 грн</th>
        <th>Професійний<br>1000 грн</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <th>Безлімітний трафік</th>
        <td>+</td>
        <td>+</td>
        <td>+</td>
        <td>+</td>
      </tr>
      <tr>
        <th>Wi-Fi роутер</th>
        <td>-</td>
        <td>+</td>
        <td>+</td>
        <td>+</td>
      </tr>
      <tr>
        <th>Статична IP-адреса</th>
        <td>-</td>
        <td>-</td>
        <td>+</td>
        <td>+</td>
      </tr>
      <tr>
        <th>Телебачення</th>
        <td>-</td>
        <td>+</td>
        <td>-</td>
        <td>+</td>
      </tr>
      <tr>
        <th>Підтримка 24/7</th>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>+</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
