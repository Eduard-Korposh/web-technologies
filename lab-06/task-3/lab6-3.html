<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="form">
        <h1 class="form-title">Реєстрація на курс</h1>
        <p class="form-intro">Заповніть форму, щоб записатися на курс веб-розробки. Після реєстрації на вказаний email прийде лист із розкладом занять.</p>
        <div class="form-fields">
            <div class="form-group">
                <label class="form-label form-label-required" for="firstname">Ім'я</label>
                <input class="form-input" type="text" id="firstname">
            </div>
            <div class="form-group">
                <label class="form-label form-label-required" for="lastname">Прізвище</label>
                <input class="form-input" type="text" id="lastname">
            </div>
            <div class="form-group">
                <label class="form-label form-label-required" for="email">Email</label>
                <input class="form-input" type="email" id="email">
            </div>
            <div class="form-group">
                <label class="form-label form-label-required" for="phone">Телефон</label>
                <input class="form-input" type="tel" id="phone">
            </div>
            <div class="form-group">
                <label class="form-label form-label-required" for="password">Пароль</label>
                <input class="form-input form-input-password" type="password" id="password">
            </div>
            <div class="form-group">
                <label class="form-label form-label-required" for="password-repeat">Повторіть пароль</label>
                <input class="form-input form-input-password" type="password" id="password-repeat">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="about">Про себе</label>
            <textarea class="form-textarea" id="about"></textarea>
        </div>

        <ul class="form-hints">
            <li class="hint-item">Не менше 8 символів</li>
            <li class="hint-item">Хоча б одна цифра</li>
            <li class="hint-item">Хоча б одна велика літера</li>
            <li class="hint-item">Паролі мають збігатися</li>
        </ul>

        <p>
            <input type="checkbox" id="agree">
            <label class="rules-label" for="agree">Погоджуюсь з <a class="rules-link" href="#">правилами курсу</a></label>
        </p>

        <div class="form-buttons">
            <button class="btn btn-reset" type="reset">Скасувати</button>
            <button class="btn btn-submit" type="submit">Записатись</button>
        </div>
    </form>
</body>
</html>
