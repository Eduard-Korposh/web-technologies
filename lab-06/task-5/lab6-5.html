<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-widget">
        <div class="weather-card"></div>

        <img class="weather-cloud" src="cloud.png" alt="Хмарно">

        <div class="cloud-cover"></div>

        <div class="weather-temp">17</div>

        <div class="weather-nav">
            <span class="nav-arrow">&larr;</span>
            <span class="nav-arrow">&rarr;</span>
        </div>

        <div class="forecast-panel">
            <div class="forecast-day">
                <span class="forecast-name">Mon</span>
                <span class="forecast-value">17&deg;</span>
            </div>
            <div class="forecast-day">
                <span class="forecast-name">Tue</span>
                <span class="forecast-value">19&deg;</span>
            </div>
            <div class="forecast-day">
                <span class="forecast-name">Wed</span>
                <span class="forecast-value">16&deg;</span>
            </div>
            <div class="forecast-day">
                <span class="forecast-name">Thu</span>
                <span class="forecast-value">18&deg;</span>
            </div>
            <div class="forecast-day">
                <span class="forecast-name">Fri</span>
                <span class="forecast-value">21&deg;</span>
            </div>
        </div>
    </div>
</body>
</html>
